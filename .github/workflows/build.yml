name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package-lock.json is gitignored, so there is nothing to cache and
      # `npm ci` cannot be used.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: web-ext lint
        run: npx web-ext lint --source-dir dist

      # Rebuilds each browser target and creates target-specific zip packages.
      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v5
        with:
          name: smart-rss-firefox
          path: artifacts/*_firefox.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: smart-rss-chromium
          path: artifacts/*_chromium.zip
          if-no-files-found: error
